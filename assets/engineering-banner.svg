<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">Robotics, PLCs, microcontrollers, and LLM applications</title>
<desc id="desc">Four animated engineering illustrations: a moving robot arm, a PLC scan, a microcontroller with data signals, and an LLM network. These are concept diagrams, not measurements.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223447" stroke-width=".6"/></pattern></defs>
<style>
.arm{transform-origin:104px 233px;animation:arm 12s ease-in-out infinite}.wrist{transform-origin:137px 171px;animation:wrist 12s ease-in-out infinite}
.scan{animation:scan 7s ease-in-out infinite}.led{animation:led 7s ease-in-out infinite}.flow{stroke-dasharray:12 180;animation:flow 8s linear infinite}.core{animation:core 6s ease-in-out infinite}.token{animation:token 8s ease-in-out infinite}
@keyframes arm{0%,15%,100%{transform:rotate(-9deg)}45%,65%{transform:rotate(9deg)}}
@keyframes wrist{0%,15%,100%{transform:rotate(5deg)}45%,65%{transform:rotate(-18deg)}}
@keyframes scan{0%,15%{transform:translateY(0);opacity:.2}65%{transform:translateY(54px);opacity:.85}85%,100%{transform:translateY(54px);opacity:0}}
@keyframes led{0%,15%,100%{opacity:.25}35%,70%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-192}}
@keyframes core{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes token{0%,15%,100%{opacity:.2}45%,75%{opacity:1}}
@media(prefers-reduced-motion:reduce){.arm,.wrist,.scan,.led,.flow,.core,.token{animation:none}.scan{display:none}}
</style>
<rect width="960" height="330" rx="16" fill="#0d1b2a"/><rect width="960" height="330" rx="16" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="45" fill="#f0f6fc" font-size="29" font-weight="600">Hardware, control, and the software between them</text><text x="28" y="74" fill="#a7b9cc" font-size="17">Robotics · Industrial automation · Embedded systems · AI applications</text></g>
<g fill="#122436" stroke="#294358"><rect x="24" y="98" width="216" height="208" rx="10"/><rect x="256" y="98" width="216" height="208" rx="10"/><rect x="488" y="98" width="216" height="208" rx="10"/><rect x="720" y="98" width="216" height="208" rx="10"/></g>
<g fill="#b9cddd" font-family="Consolas,monospace" font-size="17" text-anchor="middle"><text x="132" y="128">ROBOTICS</text><text x="364" y="128">PLC</text><text x="596" y="128">MICROCONTROLLER</text><text x="828" y="128">LLM</text></g>
<!-- Robot arm -->
<path d="M60 261H205M104 151V261" stroke="#2c4960" stroke-dasharray="3 5"/><path d="M82 253H125L120 238H87Z" fill="#29455d" stroke="#779db4"/>
<g class="arm"><path d="M104 233L137 171" stroke="#73d5ce" stroke-width="12" stroke-linecap="round"/><path d="M104 233L137 171" stroke="#173448" stroke-width="5"/>
<g class="wrist"><path d="M137 171L179 189" stroke="#73d5ce" stroke-width="10" stroke-linecap="round"/><path d="M179 189L192 180L205 188M179 189L189 205L204 203" fill="none" stroke="#e9b867" stroke-width="4" stroke-linecap="round"/></g><circle cx="137" cy="171" r="8" fill="#13283c" stroke="#e9b867" stroke-width="2"/></g><circle cx="104" cy="233" r="10" fill="#13283c" stroke="#e9b867" stroke-width="2"/>
<!-- PLC scan and outputs -->
<rect x="290" y="153" width="148" height="108" rx="6" fill="#1c3449" stroke="#7391a8"/><rect x="302" y="165" width="96" height="77" rx="3" fill="#0d1c2b"/>
<g stroke="#4e758e" fill="none"><path d="M311 178H389M311 193H389M311 208H389M311 223H389"/><path d="M324 175V181M338 175V181M346 190V196M360 190V196M324 205V211M338 205V211"/></g><rect class="scan" x="307" y="174" width="85" height="5" rx="2" fill="#62d9c9"/>
<g fill="#6cddbd"><circle class="led" cx="416" cy="176" r="5"/><circle class="led" cx="416" cy="195" r="5" style="animation-delay:-2s"/><circle class="led" cx="416" cy="214" r="5" style="animation-delay:-4s"/></g><g stroke="#88a0b4" stroke-width="3"><path d="M312 254V268M326 254V268M340 254V268M354 254V268M368 254V268M382 254V268M396 254V268M410 254V268"/></g>
<!-- MCU pins, core and data -->
<g stroke="#5e829b" stroke-width="3"><path d="M553 174H541M553 190H529M553 206H541M553 222H529M639 174H651M639 190H664M639 206H651M639 222H664M570 159V146M587 159V141M604 159V146M621 159V141M570 240V252M587 240V263M604 240V252M621 240V263"/></g>
<rect x="553" y="159" width="86" height="82" rx="7" fill="#1c354c" stroke="#8ab0c5"/><rect class="core" x="573" y="178" width="46" height="44" rx="4" fill="#255b65" stroke="#70d6c8"/>
<text x="596" y="205" text-anchor="middle" fill="#d4f4ef" font-family="Consolas,monospace" font-size="15">MCU</text>
<path class="flow" d="M529 190H553M639 206H664M587 241V263" fill="none" stroke="#edc576" stroke-width="4"/>
<!-- LLM graph and output tokens -->
<g fill="none" stroke="#36566e" stroke-width="2"><path d="M753 177L789 163L829 184L869 166L905 184M753 177L789 211L829 184L869 218L905 184M753 220L789 211L829 231L869 218L905 184M789 163L829 231L869 166"/></g>
<path class="flow" d="M753 177L789 163L829 184L869 218L905 184" fill="none" stroke="#70d6c8" stroke-width="3"/>
<g fill="#1b364b" stroke="#7aa6be" stroke-width="2"><circle cx="753" cy="177" r="6"/><circle cx="753" cy="220" r="6"/><circle cx="789" cy="163" r="7"/><circle cx="789" cy="211" r="7"/><circle class="core" cx="829" cy="184" r="9"/><circle cx="829" cy="231" r="7"/><circle cx="869" cy="166" r="7"/><circle cx="869" cy="218" r="7"/><circle cx="905" cy="184" r="6"/></g>
<g fill="#e9b867"><rect class="token" x="784" y="251" width="21" height="7" rx="2"/><rect class="token" x="812" y="251" width="31" height="7" rx="2" style="animation-delay:-2s"/><rect class="token" x="850" y="251" width="21" height="7" rx="2" style="animation-delay:-4s"/></g>
</svg>