<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
<title id="title">Embedded systems, robotics, and industrial controls</title>
<desc id="desc">An original engineering illustration with a moving robot arm and a slowly traced signal. This is decorative motion, not test data.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223447" stroke-width=".6"/></pattern><linearGradient id="fade"><stop stop-color="#112334"/><stop offset="1" stop-color="#0c1725"/></linearGradient></defs>
<style>
.arm{transform-origin:734px 156px;animation:arm 12s ease-in-out infinite}.wrist{transform-origin:787px 82px;animation:wrist 12s ease-in-out infinite}.trace{stroke-dasharray:480;animation:trace 12s ease-in-out infinite}.pulse{animation:pulse 6s ease-in-out infinite}
@keyframes arm{0%,15%,100%{transform:rotate(-8deg)}45%,65%{transform:rotate(12deg)}}
@keyframes wrist{0%,15%,100%{transform:rotate(8deg)}45%,65%{transform:rotate(-22deg)}}
@keyframes trace{0%{stroke-dashoffset:480;opacity:.2}35%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.2}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.arm,.wrist,.trace,.pulse{animation:none}.trace{stroke-dashoffset:0}}
</style>
<rect width="960" height="210" rx="16" fill="url(#fade)"/><rect width="960" height="210" rx="16" fill="url(#grid)"/>
<path d="M32 26H54M32 26V48M928 184H906M928 184V162" stroke="#52c8bf" fill="none"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="68" fill="#f0f6fc" font-size="31" font-weight="600">Embedded systems &amp; robotics</text><text x="64" y="99" fill="#a5b8ca" font-size="18">Industrial controls · Simulation · AI tools</text></g>
<path d="M64 153H140L154 135L171 172L190 124L209 166L227 143L245 153H495" fill="none" stroke="#284a58" stroke-width="2"/>
<path class="trace" d="M64 153H140L154 135L171 172L190 124L209 166L227 143L245 153H495" fill="none" stroke="#59d7ca" stroke-width="2.5"/>
<circle class="pulse" cx="495" cy="153" r="4" fill="#e9b867"/>
<g stroke="#36566b" fill="none"><circle cx="734" cy="156" r="90" stroke-dasharray="3 7"/><path d="M644 156H900M734 32V182"/></g>
<path d="M701 178H767L760 161H708Z" fill="#213a4e" stroke="#6b95ab"/>
<g class="arm"><path d="M734 156L787 82" stroke="#78d9d2" stroke-width="15" stroke-linecap="round"/><path d="M734 156L787 82" stroke="#153447" stroke-width="7" stroke-linecap="round"/>
<g class="wrist"><path d="M787 82L851 98" stroke="#78d9d2" stroke-width="12" stroke-linecap="round"/><path d="M787 82L851 98" stroke="#153447" stroke-width="5"/><path d="M851 98L868 89L884 98M851 98L864 115L881 114" fill="none" stroke="#e9b867" stroke-width="5" stroke-linecap="round"/></g>
<circle cx="787" cy="82" r="10" fill="#0e2030" stroke="#e9b867" stroke-width="3"/></g>
<circle cx="734" cy="156" r="12" fill="#0e2030" stroke="#e9b867" stroke-width="3"/>
</svg>