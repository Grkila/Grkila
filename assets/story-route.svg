<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-labelledby="title desc">
<title id="title">My path so far</title>
<desc id="desc">A circuit trace connects five chapters: Teams (EESTEC and an EESTech Challenge win), Build (the gripper thesis), Field (NSpace at the European Rover Challenge 2025), Industry (CERN in 2026), and Now (an M.Sc. in Novi Sad). A signal travels along the trace and lights each chapter in turn.</desc>
<style>.lab{font-family:"Segoe UI",Arial,sans-serif;font-size:19px;font-weight:600;fill:#e9eef3}.sub{font-family:Consolas,Menlo,monospace;font-size:12.5px;fill:#93a4b5}.num{font-family:Consolas,Menlo,monospace;font-size:11px;font-weight:700}.sig{stroke-dasharray:70 2009;animation:sig 8s linear infinite}@keyframes sig{0%{stroke-dashoffset:70}75%,100%{stroke-dashoffset:-1005}}.halo{opacity:0;transform-box:fill-box;transform-origin:center}.now{animation:now 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes now{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}.h0{animation:h0 8s linear infinite}@keyframes h0{0%,5.5%{opacity:0;transform:scale(.6)}7.5%{opacity:1;transform:scale(1)}20.0%,100%{opacity:0;transform:scale(1.6)}}.h1{animation:h1 8s linear infinite}@keyframes h1{0%,20.0%{opacity:0;transform:scale(.6)}22.0%{opacity:1;transform:scale(1)}34.5%,100%{opacity:0;transform:scale(1.6)}}.h2{animation:h2 8s linear infinite}@keyframes h2{0%,34.6%{opacity:0;transform:scale(.6)}36.6%{opacity:1;transform:scale(1)}49.1%,100%{opacity:0;transform:scale(1.6)}}.h3{animation:h3 8s linear infinite}@keyframes h3{0%,49.1%{opacity:0;transform:scale(.6)}51.1%{opacity:1;transform:scale(1)}63.6%,100%{opacity:0;transform:scale(1.6)}}.h4{animation:h4 8s linear infinite}@keyframes h4{0%,63.6%{opacity:0;transform:scale(.6)}65.6%{opacity:1;transform:scale(1)}78.1%,100%{opacity:0;transform:scale(1.6)}}@media (prefers-reduced-motion:reduce){.sig,.now,.h0,.h1,.h2,.h3,.h4{animation:none!important}.sig{opacity:0}}</style>
