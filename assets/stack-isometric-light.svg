<path d="M95 228L215 288L215 304L95 244Z" fill="#e9eef2" stroke="#587852" stroke-opacity=".35"/>
<path d="M215 288L335 228L335 244L215 304Z" fill="#dfe5eb" stroke="#587852" stroke-opacity=".35"/>
<path d="M215 168L335 228L215 288L95 228Z" fill="#eef2f6" stroke="#587852" stroke-opacity=".75"/>
<path d="M215 182L307 228L215 274L123 228Z" fill="none" stroke="#587852" stroke-opacity=".2" stroke-dasharray="3 5"/>
