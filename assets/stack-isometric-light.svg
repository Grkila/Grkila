<path d="M95 340L215 400L215 416L95 356Z" fill="#e9eef2" stroke="#1b7c83" stroke-opacity=".35"/>
<path d="M215 400L335 340L335 356L215 416Z" fill="#dfe5eb" stroke="#1b7c83" stroke-opacity=".35"/>
<path d="M215 280L335 340L215 400L95 340Z" fill="#eef2f6" stroke="#1b7c83" stroke-opacity=".75"/>
<path d="M215 294L307 340L215 386L123 340Z" fill="none" stroke="#1b7c83" stroke-opacity=".2" stroke-dasharray="3 5"/>
