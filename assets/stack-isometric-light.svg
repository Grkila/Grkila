<text class="code" x="215" y="164" text-anchor="middle" fill="#886d22">L5</text>
<path d="M343 116H408" stroke="#c4ccd5" stroke-dasharray="2 4"/>
<circle cx="414" cy="116" r="3" fill="#886d22"/>
<text class="lab" x="428" y="113">Supervision &amp; data</text>
<text class="tech" x="428" y="131">SCADA · WinCC · SQL · OpenCV · MediaPipe</text>
</g>
<g class="lift5">
<path d="M95 60L215 120L215 136L95 76Z" fill="#e9eef2" stroke="#9a6700" stroke-opacity=".35"/>
<path d="M215 120L335 60L335 76L215 136Z" fill="#dfe5eb" stroke="#9a6700" stroke-opacity=".35"/>
<path d="M215 0L335 60L215 120L95 60Z" fill="#eef2f6" stroke="#9a6700" stroke-opacity=".75"/>
<path d="M215 14L307 60L215 106L123 60Z" fill="none" stroke="#9a6700" stroke-opacity=".2" stroke-dasharray="3 5"/>
<path class="glow glow5" d="M215 0L335 60L215 120L95 60Z" fill="#9a6700" fill-opacity=".14" stroke="#9a6700" stroke-width="2"/>
<text class="code" x="215" y="108" text-anchor="middle" fill="#9a6700">L6</text>
<path d="M343 60H408" stroke="#c4ccd5" stroke-dasharray="2 4"/>
<circle cx="414" cy="60" r="3" fill="#9a6700"/>
