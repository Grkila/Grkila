<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Stack, from silicon to SCADA</title>
<desc id="desc">An isometric stack of six layers, from hardware and test at the bottom to AI and applications at the top, with the main tools for each layer. A signal climbs from the bottom layer to the top.</desc>
<style>
.lab{font-family:"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:600;fill:#1f2328}
.tech{font-family:Consolas,Menlo,monospace;font-size:11.5px;fill:#59636e}
.code{font-family:Consolas,Menlo,monospace;font-size:11px;font-weight:700}
.glow{opacity:0;animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:0}6%{opacity:1}24%{opacity:0}}
.pkt{animation:pkt 6s ease-in-out infinite}
@keyframes pkt{0%{transform:translateY(0);opacity:0}4%{opacity:1}42%{opacity:1}46%{transform:translateY(-290px);opacity:0}100%{transform:translateY(-290px);opacity:0}}
@keyframes lift0{0%,35%,100%{transform:translateY(0)}60%,80%{transform:translateY(0px)}}
.lift0{animation:lift0 6s ease-in-out infinite}.glow0{animation-delay:0.00s}
@keyframes lift1{0%,35%,100%{transform:translateY(0)}60%,80%{transform:translateY(-5px)}}
.lift1{animation:lift1 6s ease-in-out infinite}.glow1{animation-delay:0.45s}
@keyframes lift2{0%,35%,100%{transform:translateY(0)}60%,80%{transform:translateY(-10px)}}
.lift2{animation:lift2 6s ease-in-out infinite}.glow2{animation-delay:0.90s}
@keyframes lift3{0%,35%,100%{transform:translateY(0)}60%,80%{transform:translateY(-15px)}}
.lift3{animation:lift3 6s ease-in-out infinite}.glow3{animation-delay:1.35s}
@keyframes lift4{0%,35%,100%{transform:translateY(0)}60%,80%{transform:translateY(-20px)}}
.lift4{animation:lift4 6s ease-in-out infinite}.glow4{animation-delay:1.80s}
@keyframes lift5{0%,35%,100%{transform:translateY(0)}60%,80%{transform:translateY(-25px)}}
.lift5{animation:lift5 6s ease-in-out infinite}.glow5{animation-delay:2.25s}
@media (prefers-reduced-motion:reduce){.glow,.lift0,.lift1,.lift2,.lift3,.lift4,.lift5,.pkt{animation:none!important}.pkt{opacity:0}}
</style>
<rect x=".5" y=".5" width="959" height="479" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g transform="translate(0 44)">
<ellipse cx="215" cy="422" rx="146" ry="13" fill="#8c959f" opacity=".25"/>
