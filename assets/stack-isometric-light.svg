<path d="M95 172L215 232L215 248L95 188Z" fill="#e9eef2" stroke="#76733b" stroke-opacity=".35"/>
<path d="M215 232L335 172L335 188L215 248Z" fill="#dfe5eb" stroke="#76733b" stroke-opacity=".35"/>
